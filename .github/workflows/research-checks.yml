name: Research pipeline checks

on:
  push:
    branches:
      - research/**
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Compile research scripts
        run: python -m compileall -q research
      - name: Run research unit tests
        run: python -m unittest discover -s research -p "test_*.py" -v
